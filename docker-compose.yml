services:
  postgres-iot:
    image: postgres:15
    container_name: postgres-iot
    restart: unless-stopped
    environment:
      POSTGRES_USER: iot_user
      POSTGRES_PASSWORD: iot_password
      POSTGRES_DB: iot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot_user -d iot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: pipeline-iot-dashboard
    container_name: dashboard-iot
    restart: unless-stopped
    depends_on:
      postgres-iot:
        condition: service_healthy
    command: bash -lc "python src/ingest_csv.py; streamlit run src/dashboard.py --server.address 0.0.0.0 --server.port 8501"
    environment:
      DB_HOST: postgres-iot
      DB_PORT: 5432
      DB_USER: iot_user
      DB_PASSWORD: iot_password
      DB_NAME: iot_db
    ports:
      - "8501:8501"
    volumes:
      - .:/app

volumes:
  postgres_data:
