name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: iot_user
          POSTGRES_PASSWORD: iot_password
          POSTGRES_DB: iot_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iot_user -d iot_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: iot_user
      DB_PASSWORD: iot_password
      DB_NAME: iot_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Verificar lint
        run: ruff check .
      - name: Executar testes
        run: pytest -s
